# ~/.yocto/site.conf  --  linked into <builddir>/conf/site.conf by tegra-demo-distro's setup-env

# Shared caches (bind-mounted from the WSL host by docker/yocto-shell.sh)
DL_DIR ?= "/srv/yocto/downloads"
SSTATE_DIR ?= "/srv/yocto/sstate-cache"

# Also emit a plain rootfs tarball next to the .tegraflash-tar.zst bundle.
# Needed for the dual-boot install into the NVMe (roadmap Phase 2c).
IMAGE_FSTYPES:append = " tar.gz"

# Optional, if disk is tight: delete each recipe's tmp/work dir after it is built.
# Saves a lot of space; failed tasks keep their work dir so debugging still works.
# INHERIT += "rm_work"

# Keep the hash-equivalence DB with the shared sstate cache, or sstate reuse breaks
# across build directories and between developers.
BB_HASHSERVE_DB_DIR ?= "${SSTATE_DIR}"
